name: Windows MSI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build Windows executables
        run: cargo build --locked --release

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install wix --version 6.0.2 --tool-path "$env:RUNNER_TEMP\wix" --add-source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\wix\wix.exe" extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI and collect files
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw 'Cargo package version was not found' }
          $repo = (Get-Location).Path
          $release = (Resolve-Path target\release).Path
          New-Item -ItemType Directory -Force target\package | Out-Null
          & "$env:RUNNER_TEMP\wix\wix.exe" build -arch x64 -culture en-US -ext WixToolset.UI.wixext/6.0.2 `
            -d "ProductVersion=$version" -d "BuildDir=$release" -d "RepoDir=$repo" `
            -o "target\package\Volume3-$version-x64.msi" installer\Volume3.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\wix\wix.exe" msi validate "target\package\Volume3-$version-x64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase((Resolve-Path "target\package\Volume3-$version-x64.msi").Path, 0)
          $view = $database.OpenView('SELECT `Dialog` FROM `Dialog`')
          $view.Execute()
          $dialogs = @()
          while ($record = $view.Fetch()) { $dialogs += $record.StringData(1) }
          $view.Close()
          foreach ($expected in @('WelcomeEulaDlg', 'ProgressDlg', 'ExitDialog')) {
            if ($expected -notin $dialogs) { throw "Installer dialog is missing: $expected" }
          }
          Copy-Item -Path @('target\release\volume3-tray.exe', 'target\release\volume3.exe', 'LICENSE') -Destination 'target\package'

      - name: Verify MSI installation and upgrade
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $package = (Get-ChildItem target/package/*.msi -File).FullName
          $previous = Join-Path $env:RUNNER_TEMP 'Volume3-previous.msi'
          $repo = (Get-Location).Path
          $release = (Resolve-Path target/release).Path
          & "$env:RUNNER_TEMP\wix\wix.exe" build -arch x64 -culture en-US -ext WixToolset.UI.wixext/6.0.2 `
            -d "ProductVersion=$version" -d "BuildDir=$release" -d "RepoDir=$repo" `
            -o $previous installer/Volume3.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($msi in @($previous, $package)) {
            $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MSI installation failed: $($process.ExitCode)" }
          }
          $directory = Join-Path $env:ProgramFiles 'Volume3'
          foreach ($name in @('volume3-tray.exe', 'volume3.exe', 'volume3.installed')) {
            if (-not (Test-Path (Join-Path $directory $name))) { throw "Missing installed file: $name" }
          }
          $registrations = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Volume3' })
          if ($registrations.Count -ne 1) { throw "Expected one Volume3 installation, found $($registrations.Count)" }
          $process = Start-Process msiexec.exe -ArgumentList "/x `"$package`" /qn /norestart" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI removal failed: $($process.ExitCode)" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: volume3-windows-x64
          path: |
            target/package/*.msi
            target/package/*.exe
            target/package/LICENSE
          if-no-files-found: error
          retention-days: 90

      - name: Publish main build to Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "main-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $assets = Get-ChildItem -Path target/package -File |
            Where-Object { $_.Extension -in '.msi', '.exe' -or $_.Name -eq 'LICENSE' } |
            ForEach-Object { $_.FullName }
          gh release create $tag $assets `
            --target $env:GITHUB_SHA `
            --title "Volume3 main build #$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT" `
            --notes "Automated Windows x64 build from main at $env:GITHUB_SHA." `
            --prerelease --latest=false
