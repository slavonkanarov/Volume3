name: Windows MSI

on:
  push:
    branches: [dev, release, main]
    tags: ['v*']
  pull_request:
    branches: [dev, release, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msi-${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'publish' || github.ref }}
  queue: max

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Set build version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $base = ($metadata.packages | Where-Object name -eq 'volume3').version
          if ($base -cnotmatch '^(\d+)\.(\d+)\.(\d+)$') {
            throw "Cargo.toml must contain a stable three-part version: $base"
          }
          $series = "$($Matches[1]).$($Matches[2])"
          $minimumPatch = [int]$Matches[3]
          $versionPrefix = '^v' + [regex]::Escape($series) + '\.(0|[1-9][0-9]*)'
          $stablePattern = $versionPrefix + '$'
          $patch = $minimumPatch
          $tags = git tag --list "v$series.*"
          if ($LASTEXITCODE -ne 0) { throw 'git tag failed' }
          foreach ($tag in $tags) {
            if ($tag -cmatch $stablePattern) {
              $patch = [Math]::Max($patch, [long]$Matches[1] + 1)
            }
          }
          $nextVersion = "$series.$patch"

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF.StartsWith('refs/tags/')) {
            $tagPattern = $versionPrefix + '(-rc\.(0|[1-9][0-9]*))?$'
            if ($env:GITHUB_REF_NAME -cnotmatch $tagPattern -or [long]$Matches[1] -lt $minimumPatch) {
              throw "Tag $env:GITHUB_REF_NAME does not match the Cargo.toml version series or minimum: $base"
            }
            $branch = if ($Matches[2]) { 'release' } else { 'main' }
            git merge-base --is-ancestor HEAD "origin/$branch"
            if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME must point to a commit on $branch" }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $version = $nextVersion
            # Reuse the version on a rerun if this commit has already been tagged.
            $headTags = git tag --points-at HEAD --list "v$series.*" --sort=-version:refname
            if ($LASTEXITCODE -ne 0) { throw 'git tag failed' }
            foreach ($tag in $headTags) {
              if ($tag -cmatch $stablePattern -and [long]$Matches[1] -ge $minimumPatch) {
                $version = $tag.Substring(1)
                break
              }
            }
          } elseif ($env:GITHUB_REF -eq 'refs/heads/release') {
            $version = "$nextVersion-rc.$env:GITHUB_RUN_NUMBER"
          } else {
            $version = "$nextVersion-dev.$env:GITHUB_RUN_NUMBER"
          }

          $msiVersion = ($version -split '-', 2)[0]
          $parts = $msiVersion.Split('.')
          if ([long]$parts[0] -gt 255 -or [long]$parts[1] -gt 255 -or [long]$parts[2] -gt 65535) {
            throw "Version exceeds Windows Installer limits: $msiVersion"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VOLUME3_BUILD_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "VOLUME3_MSI_VERSION=$msiVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build Windows executables
        run: cargo build --locked --release

      - name: Verify portable update and restart
        run: ./scripts/test-portable-update.ps1

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install wix --version 6.0.2 --tool-path "$env:RUNNER_TEMP\wix" --add-source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\wix\wix.exe" extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI and collect files
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $release = (Resolve-Path target\release).Path
          $msi = "target\package\Volume3-$env:VOLUME3_BUILD_VERSION-x64.msi"
          New-Item -ItemType Directory -Force target\package | Out-Null
          & "$env:RUNNER_TEMP\wix\wix.exe" build -arch x64 -culture en-US -ext WixToolset.UI.wixext/6.0.2 `
            -d "ProductVersion=$env:VOLUME3_MSI_VERSION" -d "BuildDir=$release" -d "RepoDir=$repo" `
            -o $msi installer\Volume3.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\wix\wix.exe" msi validate $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase((Resolve-Path $msi).Path, 0)
          $view = $database.OpenView('SELECT `Dialog` FROM `Dialog`')
          $view.Execute()
          $dialogs = @()
          while ($record = $view.Fetch()) { $dialogs += $record.StringData(1) }
          $view.Close()
          foreach ($expected in @('WelcomeEulaDlg', 'ProgressDlg', 'ExitDialog')) {
            if ($expected -notin $dialogs) { throw "Installer dialog is missing: $expected" }
          }
          Copy-Item -Path @('target\release\volume3-tray.exe', 'target\release\volume3.exe', 'LICENSE') -Destination 'target\package'

      - name: Verify MSI installation and upgrade
        shell: pwsh
        run: |
          $package = (Get-ChildItem target/package/*.msi -File).FullName
          $previous = Join-Path $env:RUNNER_TEMP 'Volume3-previous.msi'
          $repo = (Get-Location).Path
          $release = (Resolve-Path target/release).Path
          & "$env:RUNNER_TEMP\wix\wix.exe" build -arch x64 -culture en-US -ext WixToolset.UI.wixext/6.0.2 `
            -d "ProductVersion=$env:VOLUME3_MSI_VERSION" -d "BuildDir=$release" -d "RepoDir=$repo" `
            -o $previous installer/Volume3.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($msi in @($previous, $package)) {
            $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MSI installation failed: $($process.ExitCode)" }
          }
          $directory = Join-Path $env:ProgramFiles 'Volume3'
          foreach ($name in @('volume3-tray.exe', 'volume3.exe', 'volume3.installed')) {
            if (-not (Test-Path (Join-Path $directory $name))) { throw "Missing installed file: $name" }
          }
          $registrations = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Volume3' })
          if ($registrations.Count -ne 1) { throw "Expected one Volume3 installation, found $($registrations.Count)" }
          $process = Start-Process msiexec.exe -ArgumentList "/x `"$package`" /qn /norestart" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI removal failed: $($process.ExitCode)" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: volume3-windows-x64
          path: |
            target/package/*.msi
            target/package/*.exe
            target/package/LICENSE
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: volume3-windows-x64
          path: package

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$BUILD_VERSION"
          options=(--verify-tag)
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            options=(--target "$GITHUB_SHA")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists"
            exit 0
          fi
          if [[ "$tag" == *-rc.* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$tag" package/* --title "Volume3 $BUILD_VERSION" \
            --generate-notes "${options[@]}"
